name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        run: npm run dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AS-Game-Hub-Windows
          path: app/dist/*.exe
          if-no-files-found: error

      - name: Upload EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem -Path "app/dist" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "No EXE was produced in app/dist"
          }
          gh release upload $env:GITHUB_REF_NAME $exe.FullName --clobber
